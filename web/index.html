<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SD DAVLATOV">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="SD DAVLATOV" />
  <meta property="og:description" content="Built with FlutterFlow." />
  <meta name="twitter:title" content="SD DAVLATOV" />
  <meta name="twitter:description" content="Built with FlutterFlow." />
  <meta name="twitter:card" content="summary_large_image" />

  <title> SD DAVLATOV </title>
  <meta name="description" content="Built with FlutterFlow." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1d2428">

  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      overscroll-behavior-x: none;
    }
  </style>
  
</head>
<body>
  
  
  
  
  
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      Promise.resolve()
        .then(function () { return navigator.serviceWorker.getRegistrations(); })
        .then(function (registrations) {
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        })
        .then(function () {
          if (!window.caches) return [];
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          });
        })
        .then(function () {
          if (navigator.serviceWorker.controller &&
              !sessionStorage.getItem('uchetsd_sw_cache_cleared')) {
            sessionStorage.setItem('uchetsd_sw_cache_cleared', '1');
            window.location.reload();
          }
        })
        .catch(function (error) {
          console.warn('Service worker cleanup failed:', error);
        });
    })();
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
